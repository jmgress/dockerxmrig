name: Check XMRig release

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare pinned version with upstream
        id: version-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned_version=$(awk -F= '/^[[:space:]]*ARG[[:space:]]+XMRIG_VERSION[[:space:]]*=/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' Dockerfile)
          latest_version=$(gh api /repos/xmrig/xmrig/releases/latest --jq .tag_name)
          echo "pinned_version=${pinned_version}" >> "$GITHUB_OUTPUT"
          echo "latest_version=${latest_version}" >> "$GITHUB_OUTPUT"

          if [ "$pinned_version" = "$latest_version" ]; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open maintenance issue for newer XMRig release
        if: steps.version-check.outputs.update_available == 'true'
        uses: actions/github-script@v7
        env:
          PINNED_VERSION: ${{ steps.version-check.outputs.pinned_version }}
          LATEST_VERSION: ${{ steps.version-check.outputs.latest_version }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Update pinned XMRig release to ${process.env.LATEST_VERSION}`;
            const body = [
              `The Docker image is still pinned to ${process.env.PINNED_VERSION}.`,
              `Upstream XMRig has released ${process.env.LATEST_VERSION}.`,
              '',
              'Please review the upstream release notes and update the Dockerfile, config template, and docs if the new release should be adopted.'
            ].join('\n');

            const query = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const result = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 10
            });

            const existing = result.data.items.find((issue) => issue.title === title);
            if (existing) {
              core.info(`Issue already open: ${existing.html_url}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body
            });

            core.info(`Created issue: ${created.data.html_url}`);
