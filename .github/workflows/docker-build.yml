name: Docker build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dockerxmrig:test .

      - name: Smoke test image
        run: docker run --rm dockerxmrig:test --version
